version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sss_user
      POSTGRES_PASSWORD: sss_password
      POSTGRES_DB: sss_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sss_user -d sss_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sss_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sss_rabbit
      RABBITMQ_DEFAULT_PASS: sss_rabbit_pw
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data: